# =============================================================================
# SDLC-Harness/.github/workflows/harness.yml
# THE REUSABLE ENGINE WORKFLOW  (lives in the SDLC-Harness repo)
#
# Runs in the CALLER's repo context. Supplies the engine + orchestration.
#
# THREE CHECKOUTS (a reusable workflow brings none of its own files):
#   1. the CALLER's service repo  -> ./service   (the code the harness works on)
#   2. this SDLC-Harness repo   -> ./engine    (the Python engine under harness/)
#   3. YOUR-TOOLKIT-REPO            -> ./toolkit   (shared skills + instructions)
#
# CENTRAL TOOLKIT MODEL: skills/instructions are NOT committed to service repos
# (they stay gitignored there). The workflow copies them from the central toolkit
# into service/.github/ at run time, so the engine finds them at repo_root/.github
# — present for the run, never committed. One source of truth; update once.
#
# FLAT IMPORTS: engine modules import each other flatly (no __init__.py), so run.py
# is executed from INSIDE engine/harness (working-directory); --repo is ../../service.
#
# -----------------------------------------------------------------------------
# WHY engine_repo / toolkit_repo ARE INPUTS AND NOT ${{ github.repository_owner }}
# -----------------------------------------------------------------------------
# These two checkouts previously used ${{ github.repository_owner }}, which is the
# owner of the CALLING repo — not the owner of the engine. That silently worked for
# the harness author (same account) and broke for every other user: a joiner who
# forked sample-book-service got `repository: <their-name>/SDLC-Harness`, which
# does not exist. actions/checkout logged "Repository not found" but did NOT fail
# the step, so the run limped on and died later with a misleading
# "No such file or directory: engine/harness".
#
# The engine and toolkit live at a FIXED, canonical location regardless of who runs
# the harness. They are inputs (not literals) so a fork of the whole toolchain — or
# the eventual move into the BCBSM org — is a one-line change in the caller, with
# no edit to this file.
# =============================================================================
name: Harness (engine)

on:
  workflow_call:
    inputs:
      feature_id:
        description: "Story / feature id to run"
        required: true
        type: string
      base:
        description: >-
          Development branch to run against and open the PR into (e.g. PM_Sep,
          VoC_Oct). The story file and existing code are read from this branch,
          and the harness PR targets it. Blank uses the repository's default
          branch.
        required: false
        default: ""
        type: string
      java-version:
        required: false
        default: "17"
        type: string
      python-version:
        required: false
        default: "3.13"
        type: string
      node-version:
        required: false
        default: "20"
        type: string
      engine_ref:
        description: "Tag/branch of SDLC-Harness to run"
        required: false
        default: "v1"
        type: string
      toolkit_ref:
        description: "Tag/branch of YOUR-TOOLKIT-REPO to load (skills + instructions)"
        required: false
        default: "main"
        type: string
      engine_repo:
        description: "owner/repo holding the harness engine. Canonical location — NOT the caller's account."
        required: false
        default: "mgganeshguptha-source/SDLC-Harness"
        type: string
      toolkit_repo:
        description: "owner/repo holding the shared skills + instructions."
        required: false
        default: "mgganeshguptha-source/copilot-toolkit"
        type: string
      resume:
        description: >-
          Continue a halted run from its working branch instead of starting over.
          Checks out harness-wip/<feature_id>, keeps the phases that already
          passed, and skips `init` so run-state.json survives. Use after fixing
          code by hand. Leave false for a fresh run.
        required: false
        default: false
        type: boolean
      start_phase:
        description: >-
          When resuming, the phase to re-enter at (e.g. code_review, coding,
          unit_testing). Blank resumes where the run halted, which is what you
          want after fixing code and wanting the same gate re-evaluated.
        required: false
        default: ""
        type: string
      maven_libs_repo:
        description: >-
          owner/repo of a git library store laid out like an artifact
          repository: one folder per internal release repository (e.g.
          petclinic-libs-PM/) and a Maven zip under tools/. Public libraries
          come from Maven Central, unless the store also has maven-remote/
          (Maven Central copies) - then the build is fully offline and Maven
          Central is blocked. Blank = normal online build.
        required: false
        default: ""
        type: string
      maven_libs_ref:
        description: "Branch/tag of maven_libs_repo to use."
        required: false
        default: "main"
        type: string
      runs_build:
        description: >-
          Harness builds the code, runs the unit tests and the coverage gate
          after unit_testing (looping back on red or low coverage). Set false
          when the runner cannot build the repo; the developer then builds and
          tests locally before approving the PR.
        required: false
        default: true
        type: boolean
    secrets:
      COPILOT_GITHUB_TOKEN:
        description: >-
          Repo-access token: checkout of the engine + toolkit (both private in an
          org), git push, gh pr create. A classic PAT is acceptable here. It is
          NOT used for Copilot model calls — see COPILOT_MODEL_TOKEN below.
        required: true
      COPILOT_MODEL_TOKEN:
        description: >-
          OPTIONAL Copilot model credential. Leave unset to use the built-in
          Actions token (github.token + copilot-requests: write), billed to the
          organization. Set only when that route is unavailable, and never to a
          CLASSIC PAT (ghp_) — Copilot rejects it for model calls. Accepted: gho_,
          ghu_, or a fine-grained PAT with the Copilot Requests permission.
        required: false
      TOOLKIT_PR_TOKEN:
        description: >-
          OPTIONAL. A token that may push branches to and open pull requests on
          toolkit_repo. When set, a toolkit change the documentation phase
          proposed (from an answer tagged [toolkit-skill] or
          [toolkit-instruction]) is raised as a PR on the toolkit for its owner
          to review. Unset = no toolkit PRs; the run is unaffected.
        required: false

jobs:
  harness:
    runs-on: ubuntu-latest
    # A job-level permissions block sets every UNLISTED permission to none.
    # copilot-requests: write lets the built-in Actions token pay for Copilot
    # model calls (billed to the organization). It must be granted here AND in
    # the caller workflow — a reusable workflow can never exceed its caller.
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    steps:
      # --- 1. the CALLER's service repo -> ./service ---
      # On resume, check out the WORKING BRANCH rather than the default branch.
      # That branch carries the source the agent wrote, any fix a human pushed on
      # top of it, and .harness/run-state.json — without it there is nothing to
      # resume from and the run would silently start over.
      - name: Checkout target service repo
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 0
          ref: ${{ inputs.resume && format('harness-wip/{0}', inputs.feature_id) || (inputs.base != '' && inputs.base) || github.ref }}

      - name: Verify resume state
        if: inputs.resume
        working-directory: service
        run: |
          if [ ! -f .harness/run-state.json ]; then
            echo "::error title=Nothing to resume::harness-wip/${{ inputs.feature_id }} has no .harness/run-state.json."
            echo ""
            echo "Resume needs a previous run's state. Either this feature has never"
            echo "run, or the working branch was deleted. Re-trigger with resume=false"
            echo "to start a fresh run."
            exit 1
          fi
          echo "Resuming from harness-wip/${{ inputs.feature_id }}:"
          python3 -c "import json;d=json.load(open('.harness/run-state.json'));print('  halted at:',d['current_phase'],'| completed:',d['completed_phases'])"

      # --- 2. THIS engine repo -> ./engine ---
      # TOKEN REQUIRED. The engine repo is private/internal inside an org (the BCBSM
      # case). The default Actions token is scoped to the CALLER's repo only and
      # cannot read another private repo, so without an explicit token checkout
      # fails with "could not read Username for 'https://github.com'". The same
      # COPILOT_GITHUB_TOKEN that reads the toolkit reads the engine.
      - name: Checkout SDLC-Harness
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_repo }}
          ref: ${{ inputs.engine_ref }}
          path: engine
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # --- 2b. FAIL LOUDLY if the engine did not actually arrive ---
      # actions/checkout can report "Repository not found" without failing the step,
      # leaving an empty directory. Without this guard the job continues and dies
      # several steps later with an unrelated-looking path error, which is what sent
      # the first external user debugging in the wrong place entirely.
      - name: Verify engine checkout
        run: |
          if [ ! -d engine/harness ] || [ ! -f engine/harness/run.py ]; then
            echo "::error title=Engine checkout failed::Could not read ${{ inputs.engine_repo }}@${{ inputs.engine_ref }}."
            echo ""
            echo "Checked for engine/harness/run.py — not found."
            echo "Likely causes:"
            echo "  * the repo/ref does not exist (check the tag '${{ inputs.engine_ref }}' is pushed)"
            echo "  * COPILOT_GITHUB_TOKEN cannot read the engine repo (expired, no SSO"
            echo "    authorisation, or no access to that repo)"
            echo ""
            echo "Contents of ./engine:"
            ls -la engine 2>/dev/null || echo "  (directory missing)"
            exit 1
          fi
          echo "Engine OK: ${{ inputs.engine_repo }}@${{ inputs.engine_ref }}"

      # --- 3. the central toolkit -> ./toolkit (skills + instructions) ---
      # NOTE ON ACCESS: while YOUR-TOOLKIT-REPO is PRIVATE, the caller's token must be
      # able to read it. A fine-grained PAT can only be scoped to repositories owned
      # by the token's own resource owner, so a joiner's personal PAT CANNOT read a
      # private repo under a different account — even if they are a collaborator.
      # Workable options: make YOUR-TOOLKIT-REPO public, or host both repos in an org
      # where members' tokens can be granted access (the BCBSM case).
      - name: Checkout YOUR-TOOLKIT-REPO
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit_repo }}
          ref: ${{ inputs.toolkit_ref }}
          path: toolkit
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # --- 3a. FAIL LOUDLY if the toolkit did not arrive ---
      # Without skills/instructions the agent still runs, but produces code that
      # ignores every house convention — a silent quality failure that is much worse
      # than a loud stop, because the run goes green and the output is wrong.
      - name: Verify toolkit checkout
        run: |
          if [ ! -d toolkit/skills ] && [ ! -d toolkit/instructions ]; then
            echo "::error title=Toolkit checkout failed::Could not read ${{ inputs.toolkit_repo }}@${{ inputs.toolkit_ref }}."
            echo ""
            echo "Neither toolkit/skills nor toolkit/instructions is present."
            echo "If YOUR-TOOLKIT-REPO is private, your fine-grained PAT cannot read it"
            echo "unless the repo is owned by your own account or an org that has"
            echo "granted your token access."
            echo ""
            echo "Contents of ./toolkit:"
            ls -la toolkit 2>/dev/null || echo "  (directory missing)"
            exit 1
          fi
          echo "Toolkit OK: ${{ inputs.toolkit_repo }}@${{ inputs.toolkit_ref }}"

      # --- 3b. place toolkit skills/instructions into the service checkout ---
      # The engine loads capability from <service>/.github/skills and
      # <service>/.github/instructions. We copy them in for THIS run only — they
      # are never committed back, so the central-toolkit model is preserved.
      - name: Load toolkit into service workspace
        run: |
          mkdir -p service/.github
          if [ -d toolkit/skills ]; then
            cp -r toolkit/skills service/.github/
          fi
          if [ -d toolkit/instructions ]; then
            cp -r toolkit/instructions service/.github/
          fi
          echo "Loaded skills/instructions from ${{ inputs.toolkit_repo }}@${{ inputs.toolkit_ref }}"

      # --- 3c. make build wrappers executable on the runner ---
      # Repos committed from Windows store mvnw / gradlew as mode 100644 (Windows
      # does not track the execute bit). On the Linux runner that makes
      # `./mvnw test` exit 126 and the validation gate halts with ENVIRONMENT
      # FAILURE. chmod here fixes it for THIS run only, with no change to the
      # service repo. core.fileMode=false stops git from seeing the mode flip as
      # a change, so it never lands on the WIP or PR branch.
      #
      # INCOMPLETE MAVEN WRAPPER. Some repos commit the mvnw script but not its
      # .mvn/wrapper/ folder (maven-wrapper.properties / maven-wrapper.jar). The
      # script then exits 1 with "Could not find or load main class
      # org.apache.maven.wrapper.MavenWrapperMain" and the build never runs. Those
      # teams build with a plain `mvn` (e.g. in Jenkins). GitHub-hosted
      # ubuntu-latest runners have Maven preinstalled, so the runner copy of mvnw
      # is replaced with a one-line shim that calls `mvn`. The engine still runs
      # `./mvnw test`, unchanged. `assume-unchanged` hides the edit from git, so
      # `git add -u` / `git add -A` never stage it onto the WIP or PR branch. The
      # service repo itself is not modified.
      - name: Make build wrappers executable
        working-directory: service
        run: |
          git config core.fileMode false
          for w in mvnw gradlew; do
            if [ -f "$w" ]; then
              chmod +x "$w"
              echo "Made $w executable (runner copy only)."
            fi
          done
          if [ -f mvnw ] && [ ! -f .mvn/wrapper/maven-wrapper.properties ]; then
            if command -v mvn >/dev/null 2>&1; then
              printf '#!/bin/sh\n# harness shim: repo has mvnw but no .mvn/wrapper/\nexec mvn "$@"\n' > mvnw
              chmod +x mvnw
              git update-index --assume-unchanged mvnw
              echo "::warning title=Maven wrapper incomplete::.mvn/wrapper/ is missing in this repo; ./mvnw now calls the runner's mvn ($(mvn -v 2>/dev/null | head -1)). Runner copy only — repo unchanged."
            else
              echo "::warning title=Maven wrapper incomplete::.mvn/wrapper/ is missing and no mvn is installed on this runner; validation will fail."
            fi
          fi

      # --- 4. toolchains ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          # No Maven cache with a library store: the store IS the local repo.
          cache: ${{ inputs.maven_libs_repo == '' && 'maven' || '' }}

      # --- 4a. BUILD FROM A GIT LIBRARY STORE (maven_libs_repo set) ---
      # The runner cannot reach the company artifact repository, so internal
      # libraries come from a git repo laid out like it: one folder per
      # release repository (<name>-PM/ etc., SNAPSHOTs with maven-metadata.xml).
      # Public libraries come from Maven Central - or, when the store has a
      # maven-remote/ folder, from that folder only, with Maven Central's hosts
      # blocked so a gap fails loudly (fully offline). See
      # scripts/maven-store-settings.sh. mvnw is pointed at the store's own
      # Maven (the wrapper would download Maven from Maven Central). Runs AFTER setup-java, which writes its own
      # ~/.m2/settings.xml that this step replaces.
      - name: Checkout Maven library store
        if: ${{ inputs.maven_libs_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.maven_libs_repo }}
          ref: ${{ inputs.maven_libs_ref }}
          path: maven-libs
          fetch-depth: 1
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Configure build from library store
        if: ${{ inputs.maven_libs_repo != '' }}
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/maven-libs"
          ZIP=$(ls "$STORE"/tools/apache-maven-*-bin.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error title=Library store invalid::${{ inputs.maven_libs_repo }} has no tools/apache-maven-*-bin.zip."
            exit 1
          fi
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          MVN_HOME=$(ls -d "$RUNNER_TEMP"/apache-maven-*/ | head -1)
          echo "${MVN_HOME}bin" >> "$GITHUB_PATH"
          bash "$GITHUB_WORKSPACE/engine/scripts/maven-store-settings.sh" "$STORE" ~/.m2/settings.xml
          # Same variable company pipelines pass with -s, so a service's own
          # build command (e.g. "mvn -s $MAVEN_SETTINGS test") works unchanged.
          echo "MAVEN_SETTINGS=$HOME/.m2/settings.xml" >> "$GITHUB_ENV"
          # mvnw would download Maven from Maven Central; use the store's Maven.
          if [ -f service/mvnw ]; then
            printf '#!/bin/sh\n# harness shim: build from the library store\nexec "%sbin/mvn" "$@"\n' "$MVN_HOME" > service/mvnw
            chmod +x service/mvnw
            git -C service update-index --assume-unchanged mvnw
          fi
          # Offline store (has maven-remote/): prove nothing comes from Maven
          # Central by blocking its hosts. Without maven-remote/ the store holds
          # only internal libraries and public ones come from Maven Central.
          if [ -d "$STORE/maven-remote" ]; then
            echo "0.0.0.0 repo.maven.apache.org repo1.maven.org central.maven.org" | sudo tee -a /etc/hosts >/dev/null
          fi
          echo "Build from ${{ inputs.maven_libs_repo }}@${{ inputs.maven_libs_ref }} with $("${MVN_HOME}bin/mvn" -v 2>/dev/null | head -1)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # --- 5. install deps + Copilot CLI ---
      - name: Install harness dependencies
        run: pip install -r engine/requirements.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      # --- 6. run the harness (from inside engine/harness for flat imports) ---
      #
      # MODEL CREDENTIAL — WHY COPILOT_MODEL_TOKEN IS SET HERE.
      # sdk_runner.py picks the model credential in this order:
      #   COPILOT_MODEL_TOKEN -> COPILOT_GITHUB_TOKEN -> GITHUB_TOKEN
      # COPILOT_GITHUB_TOKEN is the repo-access classic PAT, which Copilot rejects
      # for model calls ("Personal Access Tokens are not supported for this
      # endpoint"). So COPILOT_MODEL_TOKEN MUST be present, or the PAT silently
      # becomes the model credential and the first phase fails with a 400.
      # Default = the built-in Actions token (ghs_), authorised for Copilot by
      # `copilot-requests: write` on this job and in the caller. An explicit
      # COPILOT_MODEL_TOKEN secret, if the caller passes one, takes precedence.
      #
      # `init` WIPES run-state.json, so it must not run when resuming — that was
      # the whole reason a halted run could only ever start over.
      - name: Initialize run (fresh runs only)
        if: ${{ !inputs.resume }}
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL_TOKEN: ${{ secrets.COPILOT_MODEL_TOKEN || github.token }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py init \
            --repo ../../service \
            --feature "${{ inputs.feature_id }}"

      # Rewind the loaded state to the phase we are re-entering, and reset the
      # retry budgets that stopped the last run — otherwise the gate that halted
      # it fires again before the agent ever sees the human's fix.
      # The story is refreshed from the BASE branch, where developers answer
      # clarifications: on a resume at context the edited story replaces the one
      # captured when the run started (otherwise the same questions come back).
      - name: Rewind state (resume only)
        if: inputs.resume
        working-directory: engine/harness
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          BASE="${{ inputs.base != '' && inputs.base || github.ref_name }}"
          BASE_REF=""
          if git -C ../../service fetch -q origin "$BASE"; then
            BASE_REF="origin/$BASE"
          else
            echo "::warning title=Base not fetched::Could not fetch $BASE; the story is not refreshed."
          fi
          ARGS=(--repo ../../service)
          if [ -n "${{ inputs.start_phase }}" ]; then
            ARGS+=(--phase "${{ inputs.start_phase }}")
          fi
          if [ -n "$BASE_REF" ]; then
            ARGS+=(--base-ref "$BASE_REF")
          fi
          python resume.py "${ARGS[@]}"

      - name: Autorun (all phases)
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Model credential — see the note at step 6. Without this line the
          # classic PAT above is used for model calls and Copilot rejects it.
          COPILOT_MODEL_TOKEN: ${{ secrets.COPILOT_MODEL_TOKEN || github.token }}
          GIT_AUTHOR_NAME: "harness-bot"
          GIT_AUTHOR_EMAIL: "harness-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "harness-bot"
          GIT_COMMITTER_EMAIL: "harness-bot@users.noreply.github.com"
          # Read by metrics.py. GITHUB_ACTOR / RUN_ID / REPOSITORY are provided
          # by Actions; these three are not.
          HARNESS_ENGINE_REF: ${{ inputs.engine_ref }}
          HARNESS_TOOLKIT_REF: ${{ inputs.toolkit_ref }}
          HARNESS_RESUMED: ${{ inputs.resume }}
          HARNESS_RUNS_BUILD: ${{ inputs.runs_build }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py autorun --repo ../../service

      # Keep the documentation phase's toolkit proposal (if any) out of the
      # service tree before the WIP and PR steps rewrite it.
      - name: Save toolkit proposal
        if: always()
        run: |
          if [ -f service/.harness/toolkit-proposal/PROPOSAL.md ]; then
            cp -r service/.harness/toolkit-proposal "$RUNNER_TEMP/toolkit-proposal"
            echo "Toolkit proposal saved."
          fi

      # Proof of where libraries came from: Maven records the source repository
      # of every downloaded library; summarise Maven Central vs the library
      # store's internal folders. Runs even when the run halted.
      - name: Report library sources
        if: ${{ always() && inputs.maven_libs_repo != '' }}
        run: bash "$GITHUB_WORKSPACE/engine/scripts/maven-library-sources.sh"

      # --- 7. collect audit files into service/audit/ (local copy) ---
      - name: Collect audit
        if: always() && hashFiles('engine/harness/run.py') != ''
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL_TOKEN: ${{ secrets.COPILOT_MODEL_TOKEN || github.token }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py collect-audit --repo ../../service || true

      # --- 8. push the WORKING BRANCH — ALWAYS (success OR halt) ---
      # This is what makes a halted run resumable: on a halt the agent's source
      # changes are preserved here so the run can be continued or fixed by hand.
      #
      # harness-wip/<feature> is deliberately NOT run-scoped: resume has to find it
      # by name, and a run_id suffix would make it unfindable. It is force-pushed
      # because it is a working branch, not history.
      #
      # WIP carries RESUME STATE ONLY, not the full artifact set. The source tree
      # (src/, docs/) rides along because -B keeps the working tree, and
      # run-state.json + blocked.md are force-added past .gitignore because resume
      # needs them. The run artifacts (context files, prompt-steps, audit trail)
      # are NOT committed here — they live on harness-metrics under
      # audit/<feature>/<run_id>/ (see step 8a), so the WIP branch stays lean
      # and there is exactly one home for them.
      #
      # A human fixing code by hand works on THIS branch, pushes, and re-triggers
      # with resume=true. Their commit and the harness's output then share one
      # lineage instead of racing on separate branches.
      - name: Push working branch (always)
        if: always() && hashFiles('engine/harness/run.py') != ''
        working-directory: service
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          FEATURE="${{ inputs.feature_id }}"
          WIP_BRANCH="harness-wip/${FEATURE}"
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          # -B with no start point keeps the working tree and just moves the ref,
          # so the source the agent wrote is preserved on the resume point.
          git checkout -B "$WIP_BRANCH"
          # Keep the WIP branch to RESUME STATE + SOURCE only.
          #
          # MULTI-MODULE SAFE. The previous version staged `git add -u` plus
          # `git add src docs`. In a multi-module repo (code under
          # <module>/src/...) there is no root src/, so that pathspec failed and
          # every NEW file the agent created (e.g. a new test class) was silently
          # left out. Instead: stage everything, then unstage the paths that must
          # never ride on WIP — the run workspace, audit trail, metrics, and the
          # toolkit copies placed under .github/ for this run. Artifacts belong on
          # harness-metrics (step 8a). Build output is excluded by the repo's own
          # .gitignore; the mvnw shim is hidden by assume-unchanged (step 3c).
          git add -A
          git reset -q -- .harness audit metrics \
            .github/skills .github/instructions .github/story-context-files 2>/dev/null || true
          # The WIP branch is the resume point and MUST carry run-state.json, or
          # `resume=true` fails with "no run-state.json". Each file is force-added
          # ON ITS OWN: `git add -f a b` aborts entirely when one path is missing,
          # and blocked.md does not exist on every halt (e.g. an environment
          # failure) — which is how run-state.json went missing before.
          for f in .harness/run-state.json .harness/blocked.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          STATUS=$(python3 -c "import json;print(json.load(open('.harness/run-state.json'))['current_phase'])" 2>/dev/null || echo unknown)
          if git diff --cached --quiet; then
            echo "Nothing new to commit on $WIP_BRANCH."
          else
            git commit -m "Harness WIP [$FEATURE] at $STATUS (run ${{ github.run_id }})"
          fi
          git push -f origin "$WIP_BRANCH"
          echo "::notice title=Working branch::$WIP_BRANCH — resume from here with resume=true"

      # --- 8a. publish METRICS + AUDIT to the long-lived metrics branch — ALWAYS ---
      # harness-metrics is the SINGLE home for everything a run produces that is not
      # the code change itself. It is long-lived and accumulates across every run
      # and every feature, so the trail persists whether the run succeeded or halted.
      #
      # Layout on the branch:
      #   metrics/<yyyy>/<mm>/<feature>-<run_id>.json   one metrics record per run
      #   audit/<feature>/<run_id>/                     ONE folder per run holding
      #       everything about it: context.md, design.md, prompt-steps.md,
      #       review.md, validation.md, validation-report.txt, pr-body.md,
      #       run-summary.json, run-state.json, blocked.md, and docs/ (the
      #       documentation phase output, which is kept out of the code PR).
      #
      # The branch is written in a SEPARATE git worktree, never by switching the
      # service checkout. Switching it fails whenever the checkout holds local
      # changes the metrics branch does not track (e.g. toolkit files copied over
      # tracked .github/ files) — and when that switch failed, the commit landed
      # on the WIP branch and leaked into the code PR, while harness-metrics never
      # received anything after the first run.
      #
      # Never fails the job: a metrics/audit push that broke a build would be
      # worse than no record at all.
      - name: Publish metrics + audit (always)
        if: always() && hashFiles('engine/harness/run.py') != ''
        working-directory: service
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          FEATURE="${{ inputs.feature_id }}"
          PR_BASE="${{ inputs.base != '' && inputs.base || github.ref_name }}"
          if [ ! -d metrics ] && [ ! -d audit ]; then
            echo "No metrics or audit produced; nothing to publish."
            exit 0
          fi

          # Documentation phase output: the docs/ files this run changed relative
          # to the base. They go into each of this run's audit folders, not the PR.
          git fetch -q origin "$PR_BASE"
          MB=$(git merge-base "origin/$PR_BASE" HEAD 2>/dev/null)
          if [ -n "$MB" ] && [ -d audit/"$FEATURE" ]; then
            git diff -z --name-only --diff-filter=ACMRT "$MB" HEAD -- docs > /tmp/run-docs
            if [ -s /tmp/run-docs ]; then
              for RUN_DIR in audit/"$FEATURE"/*/; do
                xargs -0 -I{} cp --parents {} "$RUN_DIR" < /tmp/run-docs
              done
            fi
          fi

          # Separate worktree for the metrics branch (orphan on first use).
          MDIR=$(mktemp -d)/harness-metrics
          if git fetch -q origin harness-metrics && git rev-parse -q --verify origin/harness-metrics >/dev/null; then
            git worktree add -q -B harness-metrics "$MDIR" origin/harness-metrics || exit 0
          else
            git worktree add -q --detach "$MDIR" || exit 0
            git -C "$MDIR" checkout -q --orphan harness-metrics
            git -C "$MDIR" rm -rfq . 2>/dev/null
          fi

          [ -d metrics ] && mkdir -p "$MDIR/metrics" && cp -r metrics/. "$MDIR/metrics/"
          [ -d audit ]   && mkdir -p "$MDIR/audit"   && cp -r audit/.   "$MDIR/audit/"

          cd "$MDIR"
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          git add metrics audit 2>/dev/null
          if git diff --cached --quiet; then
            echo "No new metrics or audit to publish."
          else
            git commit -q -m "Metrics + audit: ${FEATURE} run ${{ github.run_id }} by ${{ github.actor }}"
            for i in 1 2 3; do
              git push -q origin harness-metrics && break
              echo "Push raced with another run; rebasing (attempt $i)."
              git pull -q --rebase origin harness-metrics || break
            done
            echo "::notice title=Metrics + audit published::harness-metrics — audit/${FEATURE}/${{ github.run_id }}/"
          fi
          cd - >/dev/null
          git worktree remove --force "$MDIR"

      # --- 9. raise the code PR — ONLY on success ---
      # The PR branch must contain the CODE CHANGE ONLY, never the run workspace
      # (.harness/), the audit trail (audit/), metrics (metrics/) or the
      # documentation phase output (docs/). Those all live on the harness-metrics
      # branch (metrics/ + audit/<feature>/<run_id>/) and must not leak into a
      # reviewable, mergeable PR.
      #
      # The working tree at this point is the WIP state and holds everything the
      # run produced, so we do NOT branch from it. Instead we cut the PR branch
      # CLEAN from origin/<PR_BASE> and restore only the run's code changes from
      # the WIP tree on top of it. Result: the PR diff is exactly the code the run
      # changed, against the branch it will merge into — nothing else.
      - name: Open pull request with the change (success only)
        id: raise_pr
        if: success()
        working-directory: service
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          FEATURE="${{ inputs.feature_id }}"
          # PR targets the base dev branch the run was launched against (e.g.
          # PM_Sep), falling back to the triggering branch when base is blank.
          PR_BASE="${{ inputs.base != '' && inputs.base || github.ref_name }}"
          # Run-scoped branch name. No outcome segment — this branch only exists
          # on success.
          # harness/<feature>/<actor>-<yyyymmdd>-<run_id>: who ran it, the UTC
          # date, and the Actions run id. The actor is reduced to characters
          # that are safe in a branch name.
          ACTOR=$(printf '%s' "${{ github.actor }}" | tr -c 'A-Za-z0-9._-' '-')
          BRANCH="harness/${FEATURE}/${ACTOR}-$(date -u +%Y%m%d)-${{ github.run_id }}"
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"

          # MULTI-MODULE SAFE. The previous version copied only a ROOT src/ and
          # docs/ onto the PR branch. In a multi-module repo (code under
          # <module>/src/...) that copied nothing, so the PR came out empty.
          # Instead the PR takes exactly the files the WIP branch changed relative
          # to the base, wherever they live, minus the harness-only paths.

          # 1) The WIP commit (step 8) holds the run's code. Keep the PR body text
          #    (used by gh below); it lives under .harness/, which is left behind.
          WIP_SHA=$(git rev-parse HEAD)
          WORKTREE="$(mktemp -d)"
          if [ -f .harness/pr-body.md ]; then cp -a .harness/pr-body.md "$WORKTREE/pr-body.md"; fi

          # 2) Files the run changed: diff from the merge-base (so later commits on
          #    the base are never reverted), excluding everything harness-only.
          git fetch origin "$PR_BASE"
          MB=$(git merge-base "origin/$PR_BASE" "$WIP_SHA")
          # docs/ (documentation phase output) is archived in the run's audit
          # folder instead, so the PR carries the code change only. artifacts/
          # is the old metrics-branch layout and must never reach a PR.
          EXCL=(':(exclude).harness' ':(exclude)audit' ':(exclude)metrics'
                ':(exclude)docs' ':(exclude)artifacts'
                ':(exclude).github/skills' ':(exclude).github/instructions'
                ':(exclude).github/story-context-files')
          git diff -z --name-only --diff-filter=ACMRT "$MB" "$WIP_SHA" -- . "${EXCL[@]}" > "$WORKTREE/changed"
          git diff -z --name-only --diff-filter=D     "$MB" "$WIP_SHA" -- . "${EXCL[@]}" > "$WORKTREE/deleted"
          echo "Files carried into the PR:"
          tr '\0' '\n' < "$WORKTREE/changed"

          # 3) Cut the PR branch CLEAN from the base and apply only those files.
          git checkout -f -B "$BRANCH" "origin/$PR_BASE"
          if [ -s "$WORKTREE/changed" ]; then
            xargs -0 git checkout "$WIP_SHA" -- < "$WORKTREE/changed"
          fi
          if [ -s "$WORKTREE/deleted" ]; then
            xargs -0 git rm -q --ignore-unmatch -- < "$WORKTREE/deleted"
          fi

          # 4) Safety net: never let run workspace / audit / metrics be staged.
          git reset -q -- .harness audit metrics docs artifacts 2>/dev/null || true

          # 5) Nothing to commit means the run produced no code change — do not
          #    raise an empty PR; keep WIP for inspection.
          if git diff --cached --quiet; then
            echo "::warning title=No code change to PR::The run changed no files outside the harness paths; PR skipped, WIP branch kept."
            echo "pr_raised=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Harness: $FEATURE — code change (run ${{ github.run_id }})"
          git push origin "$BRANCH"

          # pr_raised gates the WIP cleanup below: the working branch is only safe
          # to delete once the change is preserved in an actual PR. A skipped or
          # failed PR create leaves pr_raised=false, so the WIP branch is KEPT and
          # the change is never lost.
          PR_BODY="$WORKTREE/pr-body.md"
          if [ -f "$PR_BODY" ]; then
            gh pr create --title "Harness: $FEATURE" --body-file "$PR_BODY" --base "$PR_BASE" --head "$BRANCH" \
              && echo "pr_raised=true" >> "$GITHUB_OUTPUT" || { echo "PR create skipped"; echo "pr_raised=false" >> "$GITHUB_OUTPUT"; }
          else
            gh pr create --title "Harness: $FEATURE" --body "Automated harness change for $FEATURE" --base "$PR_BASE" --head "$BRANCH" \
              && echo "pr_raised=true" >> "$GITHUB_OUTPUT" || { echo "PR create skipped"; echo "pr_raised=false" >> "$GITHUB_OUTPUT"; }
          fi
          rm -rf "$WORKTREE"

          # 6) Return the working tree to the WIP branch. This step cut a clean PR
          #    branch (no audit/, no metrics/), but the LATER "Delete working
          #    branch" step reads audit/*/run-summary.json from the working tree to
          #    confirm status=done before removing the resume point. Switch back so
          #    that folder is visible again. The audit trail was already published to
          #    harness-metrics (step 8a) before this step, so nothing is lost.
          git checkout -f "harness-wip/${FEATURE}" 2>/dev/null || git checkout -f - 2>/dev/null || true

      # --- 9b. raise the proposed toolkit change as a PR on the toolkit repo ---
      # Only when TOOLKIT_PR_TOKEN is set and the documentation phase wrote a
      # proposal. The harness never merges it: the toolkit owner reviews it,
      # because a toolkit change reaches every service. Only EXISTING files under
      # skills/ or instructions/ may change; a proposed file under half the size
      # of the original is treated as truncated and dropped. If an open proposal
      # PR already touches the same files, the proposal is added to it as a
      # comment instead of opening another PR.
      - name: Propose toolkit change (optional)
        if: success()
        continue-on-error: true
        env:
          TOOLKIT_PR_TOKEN: ${{ secrets.TOOLKIT_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.TOOLKIT_PR_TOKEN }}
        run: |
          PROP="$RUNNER_TEMP/toolkit-proposal"
          if [ ! -f "$PROP/PROPOSAL.md" ] || [ ! -d "$PROP/files" ]; then
            echo "No toolkit proposal from this run."; exit 0
          fi
          if [ -z "$TOOLKIT_PR_TOKEN" ]; then
            echo "::notice title=Toolkit proposal not raised::Set the TOOLKIT_PR_TOKEN secret to raise it as a PR. It is in the run artifacts."
            exit 0
          fi
          FEATURE="${{ inputs.feature_id }}"
          REPO="${{ inputs.toolkit_repo }}"
          cd "$GITHUB_WORKSPACE/toolkit"
          BRANCH="harness-proposal/${FEATURE}-${{ github.run_id }}"
          git checkout -q -B "$BRANCH"
          CHANGED=()
          while IFS= read -r -d '' f; do
            rel="${f#"$PROP/files/"}"
            case "$rel" in
              *..*) echo "::warning::skipped $rel (bad path)"; continue ;;
              skills/*|instructions/*) ;;
              *) echo "::warning::skipped $rel (only skills/ and instructions/ may change)"; continue ;;
            esac
            if [ ! -f "$rel" ]; then
              echo "::warning::skipped $rel (not an existing toolkit file)"; continue
            fi
            old=$(wc -c < "$rel"); new=$(wc -c < "$f")
            if [ "$new" -lt $((old / 2)) ]; then
              echo "::warning::skipped $rel (proposed file is under half the original size - likely truncated)"; continue
            fi
            cp "$f" "$rel"
            CHANGED+=("$rel")
          done < <(find "$PROP/files" -type f -print0)
          if git diff --quiet; then
            echo "Proposal changes nothing in the toolkit."; exit 0
          fi
          BODY="$RUNNER_TEMP/toolkit-pr-body.md"
          {
            cat "$PROP/PROPOSAL.md"
            echo
            echo "---"
            echo "Proposed by the SDLC harness from story $FEATURE in ${{ github.repository }}:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY"
          # An open proposal already touching these files: comment there instead.
          EXISTING=$(gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefName,files \
            --jq '.[] | select(.headRefName | startswith("harness-proposal/")) | [.number, (.files[].path)] | @tsv' 2>/dev/null || true)
          for rel in "${CHANGED[@]}"; do
            N=$(printf '%s\n' "$EXISTING" | awk -F'\t' -v p="$rel" '{for(i=2;i<=NF;i++) if($i==p){print $1; exit}}')
            if [ -n "$N" ]; then
              gh pr comment "$N" --repo "$REPO" --body-file "$BODY"
              echo "::notice title=Toolkit proposal added to PR #$N::An open proposal already changes $rel."
              exit 0
            fi
          done
          git -c user.name=harness-bot -c user.email=harness-bot@users.noreply.github.com \
            commit -q -am "Harness proposal from $FEATURE"
          git -c http.https://github.com/.extraheader= push -q \
            "https://x-access-token:${TOOLKIT_PR_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$REPO" --base "${{ inputs.toolkit_ref }}" --head "$BRANCH" \
            --title "Harness proposal: $FEATURE" --body-file "$BODY"

      # --- 9a. delete the working branch — ONLY on a clean, PR-raised success ---
      # The WIP branch (harness-wip/<feature>) is the resume point. It is safe to
      # remove exactly when the run FINISHED (status=done) AND the change was
      # captured in a PR — at that point there is nothing left to resume and the
      # code lives on the PR branch. On a halt, needs_input, or a success where the
      # PR step was skipped/failed, the branch is KEPT so the run can still be
      # resumed or recovered. Never fails the job — a failed cleanup is cosmetic.
      - name: Delete working branch (clean success only)
        if: success() && steps.raise_pr.outputs.pr_raised == 'true'
        working-directory: service
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          FEATURE="${{ inputs.feature_id }}"
          WIP_BRANCH="harness-wip/${FEATURE}"
          # Confirm the engine's own view of the run is 'done' before deleting the
          # resume point. run-summary.json is the machine-readable outcome the audit
          # step already relies on; if it is missing or not 'done', keep the branch.
          STATUS=$(python3 -c "import json,glob; f=sorted(glob.glob('audit/*/*/run-summary.json')); print(json.load(open(f[-1]))['status'] if f else 'unknown')" 2>/dev/null || echo unknown)
          if [ "$STATUS" != "done" ]; then
            echo "::notice title=Working branch kept::status=$STATUS (not done) — $WIP_BRANCH retained for resume."
            exit 0
          fi
          git push origin --delete "$WIP_BRANCH" \
            && echo "::notice title=Working branch cleaned up::$WIP_BRANCH deleted (run done + PR raised)." \
            || echo "::notice title=Working branch delete skipped::$WIP_BRANCH (already gone or protected)."

      # --- 10. tell the human how to continue when the run halted ---
      - name: Explain how to resume (halt only)
        if: failure() && hashFiles('engine/harness/run.py') != ''
        run: |
          echo "::notice title=How to resume::This run halted. Fix the code on harness-wip/${{ inputs.feature_id }}, push, then re-run this workflow with resume=true. The phases that already passed will not re-run. If it halted on clarification questions, answer them in the story file on the base branch instead; the resume re-reads it from there."
