# BCBSM caller workflow — the same file for backend (Maven) and frontend
# (Angular) service repos. Copy to .github/workflows/SDLC-Harness.yml on the
# service repo's default branch (master).
name: SDLC-Harness

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id (e.g. OP018-1234)"
        required: true
        type: string
      base:
        description: "Story branch: the harness reads the story, config and code from it and opens its PR into it"
        required: true
        type: string
      resume:
        description: "Continue a halted run from harness-wip/<feature_id>. Use this after answering clarification questions too: the story is re-read from the story branch."
        # NOTE: a resume reads .harness/config.yaml from harness-wip/<feature_id>,
        # not from the story branch — put a config fix on BOTH branches. A resume
        # also re-runs the AI phase it halted in before the build gate runs.
        required: false
        default: false
        type: boolean
#      start_phase:
#        description: "Resume only — phase to re-enter at. Blank = where it halted."
#        required: false
#        default: ""
#        type: choice
#        options:
#          - ""
#          - repo_instructions
#          - context
#          - design
#          - prompt_steps
#          - coding
#          - code_review
#          - unit_testing
#          - validation
#          - documentation
#          - raise_pr

# The reusable engine workflow pushes branches and opens a PR, and makes Copilot
# model calls. A reusable workflow can NEVER hold more permission than its
# caller, so every permission the engine needs must be granted here:
#   contents / pull-requests  -> branches and the PR
#   copilot-requests          -> lets the built-in Actions token pay for Copilot
#                                model calls, billed to the organization. Without
#                                this line the engine job has it set to none and
#                                the Actions-token route cannot work, whatever the
#                                engine declares. It is unnecessary only if you
#                                supply COPILOT_MODEL_TOKEN instead.
permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  harness:
    # Engine pinned to tag v1. v1 must point at an engine commit that has the
    # clarification-learning changes (toolkit_proposals input) — retag v1 on
    # the engine's default branch (master at BCBSM) after merging them, or the
    # run fails on the unknown input.
    #
    # `uses:` decides where the WORKFLOW STEPS come from; engine_repo below
    # decides where the ENGINE CODE comes from. Both must name the same repo.
    # In a client org set both to the client's engine copy (e.g.
    # BCBSM/dx_SDLC-Harness). Check on the first run: the "Set up job" log line
    # "Uses: <owner>/<repo>/.github/workflows/harness.yml@refs/tags/v1" must
    # show the client repo. (At BCBSM this still pointed at the personal repo,
    # so engine workflow fixes made in the client copy were silently ignored.)
    uses: BCBSM/dx_SDLC-Harness/.github/workflows/harness.yml@v1
    with:
      feature_id: ${{ inputs.feature_id }}
      base: ${{ inputs.base }}
      java-version: "17"     # used by backend (Maven) repos; harmless for frontend
      python-version: "3.13"
      node-version: "22"   # Node 20 is deprecated on GitHub runners
      resume: ${{ inputs.resume }}
#      start_phase: ${{ inputs.start_phase }}
      # Engine + toolkit locations. engine_repo / engine_ref MUST match the
      # repo and @ref in `uses:` above — they are the engine code the job checks
      # out and runs.
      engine_repo: BCBSM/dx_SDLC-Harness
      engine_ref: v1
      toolkit_repo: BCBSM/dx_copilot-standards-workspace
      # Toolkit's default branch. All BCBSM repos use 'master' (no 'main').
      toolkit_ref: master
      # Harness builds the code, runs unit tests + the coverage gate after
      # unit_testing (loops back on red / low coverage). false = skip; the
      # developer builds and tests locally before approving the PR.
      runs_build: true
      # Git library store, for runners that cannot reach the company artifact
      # repository. Internal libraries come from the store's repository folders
      # (e.g. bcbsm-libs/, Maven layout); public libraries come from Maven
      # Central — unless the store also has a maven-remote/ folder, which makes
      # the build fully offline and blocks Maven Central. The store must also
      # hold the Maven distribution as tools/apache-maven-<version>-bin.zip
      # (3.6.3 or later for Spring Boot 3.x). Blank = normal online build.
      # Fill the store before the first run: list internal libraries with
      #   grep -rn -A2 "<groupId>com.<client>" --include=pom.xml .
      # then repeat on each downloaded POM for its <parent> and dependencies.
      # Frontend (npm) repos: the store is not used for npm packages; leaving it
      # set is harmless (it only prepares Maven), or set it to "" for those repos.
      maven_libs_repo: BCBSM/dx_Artifactory
      # Branch of the store. Engine default is main; BCBSM's store uses master.
      maven_libs_ref: master
      # Toolkit proposals: when a story's answers show a toolkit skill or
      # instruction should change, raise it as a PR on toolkit_repo for the
      # toolkit owner to review (never merged automatically). Uses
      # COPILOT_GITHUB_TOKEN, which must be able to push to toolkit_repo.
      # false = no toolkit PRs (service rules are still recorded either way).
      toolkit_proposals: false
    secrets:
      # Repo access: checkout of the engine + toolkit, git push, gh pr create,
      # and credit reporting. A classic PAT is acceptable here.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      # Copilot model access. LEAVE THIS LINE COMMENTED OUT to use the built-in
      # Actions token (the `copilot-requests: write` route above). Uncomment and
      # add the secret only when that route is unavailable — and note that a
      # CLASSIC PAT (ghp_) is NOT accepted by Copilot for model calls; use an
      # OAuth login token (gho_), a GitHub App user token (ghu_), or a
      # fine-grained PAT with the "Copilot Requests" permission (github_pat_).
      # COPILOT_MODEL_TOKEN: ${{ secrets.COPILOT_MODEL_TOKEN }}
      # OPTIONAL. Only if toolkit PRs must use a different token from
      # COPILOT_GITHUB_TOKEN (e.g. one limited to the toolkit repo).
      # TOOLKIT_PR_TOKEN: ${{ secrets.TOOLKIT_PR_TOKEN }}
